name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and package all eight applications
        run: mvn --batch-mode -DskipTests package
  booking-and-rental:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [booking-service, rental-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Domain, architecture and PostgreSQL regression tests
        run: mvn --batch-mode -f services/${{ matrix.module }}/pom.xml verify -Pintegration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.module }}
          path: |
            services/${{ matrix.module }}/target/surefire-reports/
            services/${{ matrix.module }}/target/failsafe-reports/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
