  pgadmin:
    image: dpage/pgadmin4
    container_name: hessbnb-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hessbnb-network

volumes:
  postgres_data:

networks:
  hessbnb-network:
    driver: bridge
